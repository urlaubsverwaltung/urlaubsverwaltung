name: Release

on:
  push:
    tags:
      - 'urlaubsverwaltung*'

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --fail-at-end --show-version"

jobs:
  create-github-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Build jar with Maven
        run: ./mvnw package -Dmaven.test.skip=true -DskipTests

      - name: Extract release version
        id: vars
        run: echo "version=${GITHUB_REF#refs/*/urlaubsverwaltung-}" >> $GITHUB_OUTPUT

      - name: Create SBOMs
        run: |
          cp target/classes/META-INF/sbom/application.cdx.json target/urlaubsverwaltung-${{ steps.vars.outputs.version }}.cdx.json
          PATH="$PWD/node:$PATH" npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file target/urlaubsverwaltung-${{ steps.vars.outputs.version }}-frontend.cdx.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.vars.outputs.version }}
          body_path: .chglog/${{ steps.vars.outputs.version }}.md
          files: |
            ./target/urlaubsverwaltung-*.jar
            ./target/urlaubsverwaltung-*.cdx.json

  container-upload-github:
    needs:
      - create-github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version-file: ".tool-versions"
          cache: 'maven'
      - name: Publish docker image to GitHub Container Registry
        run: >
          ./mvnw spring-boot:build-image
          -Dmaven.test.skip=true
          -DskipTests
          -Dspring-boot.build-image.publish=true
          -Ddocker-publish-registry=ghcr.io
          -Ddocker-publish-registry-path=${{ github.repository }}
          -Ddocker-publish-registry-username=${{ github.actor }}
          -Ddocker-publish-registry-password=${{ secrets.GITHUB_TOKEN }}

  container-upload-docker-hub-urlaubsverwaltung:
    needs:
      - create-github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version-file: ".tool-versions"
          cache: 'maven'
      - name: Publish docker image to Docker Hub urlaubsverwaltung
        run: >
          ./mvnw spring-boot:build-image
          -Dmaven.test.skip=true
          -DskipTests
          -Dspring-boot.build-image.publish=true
          -Ddocker-publish-registry=registry.hub.docker.com
          -Ddocker-publish-registry-path=urlaubsverwaltung
          -Ddocker-publish-registry-username=${{ secrets.DOCKER_UV_USERNAME }}
          -Ddocker-publish-registry-password=${{ secrets.DOCKER_UV_TOKEN }}

  helm-chart-release:
    needs:
      - container-upload-github
      - container-upload-docker-hub-urlaubsverwaltung
    uses: ./.github/workflows/helm-chart-release.yml
