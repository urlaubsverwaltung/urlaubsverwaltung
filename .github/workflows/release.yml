name: Release

on:
  push:
    tags:
      - 'urlaubsverwaltung*'

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --fail-at-end --show-version"

jobs:
  create-github-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Build jar with Maven
        run: ./mvnw package -Dmaven.test.skip=true -DskipTests

      - name: Extract release version
        id: vars
        run: echo "version=${GITHUB_REF#refs/*/urlaubsverwaltung-}" >> $GITHUB_OUTPUT

      - name: Create SBOMs
        run: |
          cp target/classes/META-INF/sbom/application.cdx.json target/urlaubsverwaltung-${{ steps.vars.outputs.version }}.cdx.json
          PATH="$PWD/node:$PATH" npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file target/urlaubsverwaltung-${{ steps.vars.outputs.version }}-frontend.cdx.json

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.vars.outputs.version }}
          body_path: .chglog/${{ steps.vars.outputs.version }}.md
          files: |
            ./target/urlaubsverwaltung-*.jar
            ./target/urlaubsverwaltung-*.cdx.json

  # Builds the image without access to any registry, the upload jobs push it with --preserve-digests
  container-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.export.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version-file: ".tool-versions"
          cache: 'maven'
      - name: Build docker image
        run: >
          ./mvnw spring-boot:build-image
          -Dmaven.test.skip=true
          -DskipTests
          -Ddocker-publish-registry=localhost
          -Ddocker-publish-registry-path=urlaubsverwaltung
      - name: Export docker image
        id: export
        # layers are compressed once here, the upload jobs push these exact bytes so both registries get the same digest
        run: |
          docker save "localhost/urlaubsverwaltung/urlaubsverwaltung:${GITHUB_REF#refs/*/urlaubsverwaltung-}" -o image.tar
          skopeo copy --dest-compress docker-archive:image.tar dir:image
          echo "digest=$(skopeo manifest-digest image/manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-image
          path: image
          retention-days: 1
          compression-level: 0

  container-upload-github:
    needs:
      - container-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/urlaubsverwaltung
      DIGEST: ${{ needs.container-image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-image
          path: image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish docker image to GitHub Container Registry
        run: skopeo copy --preserve-digests dir:image "docker://$IMAGE:${GITHUB_REF#refs/*/urlaubsverwaltung-}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"

  container-upload-docker-hub-urlaubsverwaltung:
    needs:
      - container-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: docker.io/urlaubsverwaltung/urlaubsverwaltung
      DIGEST: ${{ needs.container-image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-image
          path: image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKER_UV_USERNAME }}
          password: ${{ secrets.DOCKER_UV_TOKEN }}
      - name: Publish docker image to Docker Hub urlaubsverwaltung
        run: skopeo copy --preserve-digests dir:image "docker://$IMAGE:${GITHUB_REF#refs/*/urlaubsverwaltung-}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"

  helm-chart-release:
    needs:
      - create-github-release
      - container-upload-github
      - container-upload-docker-hub-urlaubsverwaltung
    uses: ./.github/workflows/helm-chart-release.yml
