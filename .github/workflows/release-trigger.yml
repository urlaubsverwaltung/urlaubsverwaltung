name: Release Trigger

on:
  workflow_dispatch:
    inputs:
      milestoneName:
        description: 'Milestone Name'
        required: true
        default: 'Name of the Milestone'
      releaseVersion:
        description: 'Release version'
        required: true
        default: 'x.xx.x'

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --fail-at-end --show-version"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1  # required browsers are installed below

jobs:
  run-unit-and-integration-tests:
    name: "Run unit and integration tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK from .tool-versions
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Build
        run: ./mvnw verify -Dgroups="!ui"

  run-ui-test:
    name: "Run UI tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ui-test-${{ matrix.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK from .tool-versions
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Install Playwright Browsers (UI tests)
        run: ./mvnw exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.classpathScope="test" -D exec.args="install --with-deps ${{matrix.browser}}"

      - name: Test
        run: ./mvnw dependency:go-offline verify -Pui-test -Dbrowser=${{matrix.browser}}

      - name: Upload artifacts of failed tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && hashFiles('target/ui-test/**/FAILED-*') != '' }}
        with:
          name: failed-ui-tests
          path: target/ui-test/**/FAILED-*

  run-a11y-test:
    name: Accessibility Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-a11y-test-${{ matrix.browser }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK from .tool-versions
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Install Playwright Browsers (A11Y tests)
        run: ./mvnw exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.classpathScope="test" -D exec.args="install --with-deps ${{matrix.browser}}"

      - name: Test
        run: ./mvnw dependency:go-offline verify -Pa11y-test -Dbrowser=${{matrix.browser}}

      - name: Upload artifacts of failed tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && hashFiles('target/a11y-test/**/FAILED-*') != '' }}
        with:
          name: failed-a11y-tests-${{ matrix.browser }}-${{ github.run_attempt }}
          path: target/a11y-test/**/FAILED-*

  create-tag-and-release-notes:
    name: "Create tag and release notes"
    needs:
      - run-unit-and-integration-tests
      - run-ui-test
      - run-a11y-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup git user
        uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35

      - name: Create Release Notes
        uses: spring-io/github-changelog-generator@f7d7a87a3e7c627ecb8c26cf086c38ac5a939721
        with:
          milestone: ${{ github.event.inputs.milestoneName }}
          changelog-file: ${{format('{0}{1}{2}', '.chglog/', github.event.inputs.releaseVersion, '.md')}}
          config-file: '.github/release-notes.yml'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release version
        run: ./mvnw versions:set -DnewVersion=${{ github.event.inputs.releaseVersion }}
      - name: Set helm chart version and app version
        env:
          CHART: charts/urlaubsverwaltung/Chart.yaml
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          current=$(sed -n 's/^version: "\(.*\)"$/\1/p' "$CHART")
          next="${current%%.*}.${RELEASE_VERSION#*.}"
          if [ "$(printf '%s\n%s\n' "$current" "$next" | sort -V | tail -n1)" != "$next" ]; then
            echo "::error::Helm chart version $next would be lower than $current. Bump the chart major version in $CHART first."
            exit 1
          fi
          sed -i -e "s/^version: .*/version: \"$next\"/" -e "s/^appVersion: .*/appVersion: $RELEASE_VERSION/" "$CHART"
      - name: Commit release notes and release version
        run: |
          git add .chglog/*.md pom.xml charts/urlaubsverwaltung/Chart.yaml
          git commit -m "New Release Version urlaubsverwaltung-${{ github.event.inputs.releaseVersion }}"
      - name: Add release tag
        run: git tag -a -m "urlaubsverwaltung-${{ github.event.inputs.releaseVersion }}" urlaubsverwaltung-${{ github.event.inputs.releaseVersion }}
      - name: Push release notes and release version
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c
        with:
          github_token: ${{ secrets.AM_PAT }}
          branch: ${{ github.ref }}
          pull: true

      - name: Set new snapshot version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          IFS=. read -r major minor _ <<< "$RELEASE_VERSION"
          next="$major.$((minor + 1)).0-SNAPSHOT"
          ./mvnw versions:set -DnewVersion="$next"
          git add pom.xml && git commit -m "Prepare Next Snapshot Version urlaubsverwaltung-$next" -m "[skip ci]"
      - name: Push snapshot commit
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c
        with:
          github_token: ${{ secrets.AM_PAT }}
          branch: ${{ github.ref }}
          pull: true
