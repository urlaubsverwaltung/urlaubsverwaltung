name: Visual Regression Tests

# Never triggered automatically, see docs/visual-regression-tests.md
on:
  workflow_dispatch:

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --show-version"

jobs:
  visual-regression-tests:
    name: visual regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # baselines are stored in git lfs
          lfs: true

      - name: Set up JDK from .tool-versions
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      # starts the application with an empty database, the browser server in the pinned container and runs the tests
      - name: Run visual regression tests
        run: ./mvnw verify -Pvisual-test
        env:
          CI: true

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-regression-tests-report
          path: |
            target/visual-tests/report
            target/visual-tests/results
          retention-days: 14
