name: Visual Regression Tests

# Never triggered automatically, see docs/visual-regression-tests.md
on:
  workflow_dispatch:

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --show-version"

jobs:
  visual-regression-tests:
    name: visual regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # baselines are stored in git lfs
          lfs: true

      - name: Set up JDK from .tool-versions
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      # the maven build runs 'npm ci' as well, so node_modules (including @playwright/test) is ready once the
      # application is up. nothing else must write node_modules in the meantime.
      - name: Start application with empty database
        run: |
          npm run test:visual:app > app.log 2>&1 &
          for i in $(seq 1 600); do
            curl --silent --fail http://localhost:8081/actuator/health/readiness && exit 0
            sleep 1
          done
          echo "application did not become ready" && exit 1

      - name: Start browser server in pinned container
        run: |
          npm run test:visual:browser > browser.log 2>&1 &
          for i in $(seq 1 300); do
            grep --quiet "Listening on" browser.log && exit 0
            sleep 1
          done
          echo "browser server did not start" && exit 1

      - name: Run visual regression tests
        run: npm run test:visual
        env:
          CI: true

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-regression-tests-report
          path: |
            target/visual-tests/report
            target/visual-tests/results
            app.log
            browser.log
          retention-days: 14
