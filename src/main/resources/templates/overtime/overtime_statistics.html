<!doctype html>
<html
  lang="en"
  th:lang="${language}"
  th:class="|theme-${theme}|"
  th:data-nav-collapsed="${navigationCollapsed ? 'true' : null}"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:replace="~{_layout::head(title=~{::title}, styles=~{::styles}, scripts=~{::scripts}, scriptsDefer=~{::scriptsDefer}, preload=~{::preload})}"
  >
    <title th:text="#{overtime.statistics.header.title(${selectedYear})}">Überstundenstatistik</title>
    <th:block th:fragment="styles">
      <link rel="stylesheet" th:href="@{/css/overtime-statistics.css}" />
    </th:block>
    <th:block th:fragment="preload">
      <link rel="preload" th:replace="~{fragments/asset-dependency-preload::links('overtime_statistics.js')}" />
    </th:block>
    <th:block th:fragment="scripts">
      <script th:inline="javascript">
        /*<![CDATA[*/
        window.overtimeStatistics = {};
        window.overtimeStatistics.xaxisLabels = [
          /*[[#{month.january.short}]]*/ "Jan",
          /*[[#{month.february.short}]]*/ "Feb",
          /*[[#{month.march.short}]]*/ "Mär",
          /*[[#{month.april.short}]]*/ "Apr",
          /*[[#{month.may.short}]]*/ "Mai",
          /*[[#{month.june.short}]]*/ "Jun",
          /*[[#{month.july.short}]]*/ "Jul",
          /*[[#{month.august.short}]]*/ "Aug",
          /*[[#{month.september.short}]]*/ "Sep",
          /*[[#{month.october.short}]]*/ "Okt",
          /*[[#{month.november.short}]]*/ "Nov",
          /*[[#{month.december.short}]]*/ "Dez",
        ];
        window.overtimeStatistics.yaxisTitle = /*[[#{overtime.statistics.chart.y-axis-label}]]*/ "Stunden";
        window.overtimeStatistics.accruedName = /*[[#{overtime.statistics.chart.accrued}]]*/ "Aufbau";
        window.overtimeStatistics.reductionName = /*[[#{overtime.statistics.chart.reduction}]]*/ "Abbau";
        window.overtimeStatistics.balanceName = /*[[#{overtime.statistics.chart.balance}]]*/ "Saldo";
        window.overtimeStatistics.accrued = /*[[${overtimeGraph.accrued}]]*/ [];
        window.overtimeStatistics.reduction = /*[[${overtimeGraph.reduction}]]*/ [];
        window.overtimeStatistics.accruedText = /*[[${overtimeGraph.accruedText}]]*/ [];
        window.overtimeStatistics.reductionText = /*[[${overtimeGraph.reductionText}]]*/ [];
        window.overtimeStatistics.balanceText = /*[[${overtimeGraph.balanceText}]]*/ [];
        /*]]>*/
      </script>
    </th:block>
    <th:block th:fragment="scriptsDefer">
      <script defer type="module" asset:src="overtime_statistics.js"></script>
    </th:block>
  </head>
  <body th:replace="~{_layout::body(content=~{::main})}">
    <main th:fragment="main" class="content-container content--max-w">
      <div
        th:replace="~{fragments/section-heading::section-heading(~{::overtime-statistics-heading-body}, ~{::overtime-statistics-heading-actions})}"
      >
        <th:block th:ref="overtime-statistics-heading-body">
          <h1 th:text="#{overtime.statistics.title}">Überstunden - gesamtes Unternehmen</h1>
        </th:block>
        <th:block th:ref="overtime-statistics-heading-actions"> </th:block>
      </div>

      <!--
        The year selector sits in its own row instead of the section heading, because the company wide
        figures are placed above it - they are deliberately not affected by the selected year.
      -->
      <div class="mt-8 flex flex-wrap items-center gap-x-3 gap-y-2">
        <span class="text-sm font-bold" th:text="#{overtime.statistics.year.label}">Jahr</span>
        <div
          th:replace="~{fragments/year-selector::year-selector(id='year-selection', currentYear=${currentYear}, hrefPrefix=|/web/overtime/statistics?year=|, selectedYear=${selectedYear})}"
        ></div>
      </div>

      <div>
        <div class="mt-8">
          <h2 class="font-bold text-base" th:text="#{overtime.statistics.chart.title(${selectedYear})}">
            Überstunden je Monat
          </h2>
          <p class="text-sm mt-1" th:text="#{overtime.statistics.chart.description}">
            Aufbau nach oben, Abbau nach unten.
          </p>
        </div>

        <div class="mt-4 overtime-statistics-chart-container">
          <div id="overtime-statistics-chart" class="overtime-statistics-chart"></div>
        </div>
      </div>

      <div class="mt-8 statistic-summary-container">
        <h3 class="statistic-summary-container-title" th:text="#{overtime.statistics.summary.title(${selectedYear})}">
          Im Jahr
        </h3>
        <p class="text-sm" th:text="#{overtime.statistics.summary.description}">
          Summe der Balken oben. Der Saldo startet am 1. Januar bei 0.
        </p>
        <div class="statistic-summary-card-box">
          <p class="statistic-summary-card">
            <span class="statistic-summary-card__label">
              <span
                class="inline-block h-3 w-3 rounded-xs mr-2"
                style="background-color: var(--overtime-accrued-color)"
              ></span>
              <th:block th:text="#{overtime.statistics.summary.accrued}">Aufgebaut</th:block>
            </span>
            <span class="statistic-summary-card__content" th:text="${overtimeYearSummary.accrued}">30 Std.</span>
          </p>
          <p class="statistic-summary-card">
            <span class="statistic-summary-card__label">
              <span
                class="inline-block h-3 w-3 rounded-xs mr-2"
                style="background-color: var(--overtime-reduction-color)"
              ></span>
              <th:block th:text="#{overtime.statistics.summary.reduction}">Abgebaut</th:block>
            </span>
            <span class="statistic-summary-card__content" th:text="${overtimeYearSummary.reduction}">24 Std.</span>
          </p>
          <p class="statistic-summary-card">
            <span class="statistic-summary-card__label" th:text="#{overtime.statistics.summary.balance}">Saldo</span>
            <span class="statistic-summary-card__content" th:text="${overtimeYearSummary.balance}">6 Std.</span>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
