<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title></title>
  </head>
  <body>
    <th:block th:fragment="section">
      <div class="uv-form__group">
        <!-- Selection of the time zone -->
        <div class="uv-form__input-row">
          <label th:text="|#{settings.time.timezone}:|" for="timeSettings.timeZoneId"> Zeitzone </label>
          <select
            th:replace="~{fragments/select::one(id='timeSettings.timeZoneId', name='timeSettings.timeZoneId', options=~{::settings-time-timezoneid}, required=true)}"
            id="yearSelect"
          >
            <th:block th:fragment="settings-time-timezoneid">
              <option
                th:each="timeZoneId : ${availableTimezones}"
                th:text="${timeZoneId}"
                th:value="${timeZoneId}"
                th:selected="${settings.timeSettings.timeZoneId == timeZoneId}"
              ></option>
            </th:block>
          </select>
        </div>

        <!-- Start of working hours settings for a work day -->
        <div class="uv-form__input-row">
          <label th:text="|#{settings.time.workDay.begin}:|" for="timeSettings.workDayBeginHour">
            Beginn eines Arbeitstags
          </label>
          <th:block
            th:replace="~{fragments/hour-and-minute-input::hour-and-minute-input(hourFieldName='timeSettings.workDayBeginHour', hoursTestId='settings-time-hours', minuteFieldName='timeSettings.workDayBeginMinute', minutesTestId='settings-time-minutes', required=true)}"
          ></th:block>
        </div>

        <!-- End of working hours settings for a work day -->
        <div class="uv-form__input-row">
          <label th:text="|#{settings.time.workDay.end}:|" for="timeSettings.workDayEndHour">
            Ende eines Arbeitstags
          </label>
          <th:block
            th:replace="~{fragments/hour-and-minute-input::hour-and-minute-input(hourFieldName='timeSettings.workDayEndHour', hoursTestId='settings-time-hours', minuteFieldName='timeSettings.workDayEndMinute', minutesTestId='settings-time-minutes', required=true)}"
          ></th:block>
        </div>
      </div>
    </th:block>
  </body>
</html>
