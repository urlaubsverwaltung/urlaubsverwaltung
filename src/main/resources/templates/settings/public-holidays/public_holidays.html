<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title></title>
  </head>
  <body>
    <th:block th:fragment="section">
      <div class="uv-form__group">
        <div class="uv-form__group-info">
          <p class="uv-help-block">
            <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
            <th:block th:text="#{settings.publicHolidays.description}" />
          </p>
          <p class="uv-help-block">
            <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
            <th:block th:text="#{settings.publicHolidays.company-closure.hint}" />
            <a th:href="@{/web/company-closure}" th:text="#{nav.company.company-closures}">Betriebsruhe</a>
          </p>
        </div>

        <!-- Federal state settings for public holidays -->
        <div class="uv-form__input-row">
          <label th:text="|#{settings.publicHolidays.federalState}:|" for="federalStateType">
            Globale Feiertagsregelung
          </label>
          <select
            th:replace="~{fragments/select::one(id='federalStateType', name='publicHolidaysSettings.federalState', options=~{::settings-workingtimes-federalStateType}, required=true)}"
          >
            <th:block th:fragment="settings-workingtimes-federalStateType">
              <optgroup th:label="#{country.general}">
                <option
                  th:text="#{federalState.NONE}"
                  value="NONE"
                  th:selected="${settings.publicHolidaysSettings.federalState == 'NONE'}"
                ></option>
              </optgroup>
              <optgroup
                th:each="federalStatesByCountry : ${federalStateTypes}"
                th:label="#{country.__${federalStatesByCountry.key}__}"
              >
                <option
                  th:each="federalStateType : ${federalStatesByCountry.value}"
                  th:text="#{federalState.__${federalStateType}__}"
                  th:value="${federalStateType}"
                  th:selected="${settings.publicHolidaysSettings.federalState == federalStateType}"
                ></option>
              </optgroup>
            </th:block>
          </select>
        </div>
      </div>
    </th:block>
  </body>
</html>
