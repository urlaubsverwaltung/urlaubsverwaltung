<!doctype html>
<html
  lang="en"
  th:lang="${language}"
  th:class="|theme-${theme}|"
  th:data-nav-collapsed="${navigationCollapsed ? 'true' : null}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:asset="http://www.w3.org/1999/xhtml"
>
  <head
    th:replace="~{_layout::head(title=~{::title}, styles=~{::styles}, scripts=~{::scripts}, scriptsDefer=~{::scriptsDefer}, preload=~{::preload})}"
  >
    <title
      th:replace="~{fragments/page-title::page-title(${monthDay == null} ? #{company-closure.data.header.title.new} : #{company-closure.data.header.title.edit(${companyClosureName})})}"
    ></title>
    <th:block th:fragment="styles">
      <link rel="stylesheet" th:href="@{/css/company-closure.css}" />
    </th:block>
    <th:block th:fragment="scripts">
      <script th:replace="~{fragments/datepicker-localization :: datepicker-localization}"></script>
    </th:block>
    <th:block th:fragment="preload">
      <link rel="preload" th:replace="~{fragments/asset-dependency-preload::links('company_closure_form.js')}" />
    </th:block>
    <th:block th:fragment="scriptsDefer">
      <script defer type="module" asset:src="company_closure_form.js"></script>
    </th:block>
  </head>
  <body th:replace="~{_layout::body(content=~{::main})}">
    <main th:fragment="main" class="content-container content--max-w">
      <form
        method="post"
        th:action="${monthDay == null} ? @{/web/company-closure/new} : @{/web/company-closure/{monthDay}/edit(monthDay=${monthDayPath})}"
        th:object="${companyClosure}"
        class="uv-form uv-form-grid"
        data-turbo="true"
        novalidate
      >
        <button type="submit" class="hidden"></button>

        <div role="group" aria-labelledby="group-companyclosure-data-label">
          <h2
            id="group-companyclosure-data-label"
            class="uv-form-legend"
            th:text="${monthDay == null} ? #{company-closure.data.header.title.new} : #{company-closure.data.header.title.edit(${companyClosureName})}"
          >
            Betriebsruhe
          </h2>

          <p
            class="uv-form__global-feedback alert alert-danger"
            th:if="${#fields.hasGlobalErrors()}"
            th:errors="*{global}"
          ></p>

          <div class="uv-form__group">
            <p th:if="${monthDay == null}" class="uv-form__group-info uv-help-block company-closure-form__info">
              <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
              <span id="monthDay-hint" th:text="#{company-closure.data.monthDay.hint}">
                Zum Beispiel 24 und 12 für den 24. Dezember
              </span>
            </p>
            <div th:if="${monthDay == null}" class="uv-form__input-row">
              <p
                id="monthDay-label"
                class="uv-form__label uv-form__label--required"
                th:text="|#{company-closure.data.date}:|"
              >
                Datum
              </p>
              <div
                role="group"
                aria-labelledby="monthDay-label"
                class="company-closure-month-day"
                th:with="hasMonthDayErrors=${#fields.hasErrors('monthDay')}"
              >
                <div class="company-closure-month-day__fields">
                  <div class="company-closure-month-day__field">
                    <label for="day" class="company-closure-month-day__label" th:text="#{company-closure.data.day}">
                      Tag
                    </label>
                    <input
                      required
                      type="text"
                      inputmode="numeric"
                      maxlength="2"
                      autocomplete="off"
                      placeholder="24"
                      th:field="*{day}"
                      th:errorclass="error"
                      th:classappend="${hasMonthDayErrors} ? 'error'"
                      th:aria-invalid="${hasMonthDayErrors or #fields.hasErrors('day')} ? 'true'"
                      th:aria-describedby="|monthDay-hint${hasMonthDayErrors ? ' monthDay-error' : ''}${#fields.hasErrors('day') ? ' day-error' : ''}|"
                      data-test-id="company-closure-day"
                    />
                    <p id="day-error" class="uv-form__input-error" th:if="${#fields.hasErrors('day')}">
                      <th:block th:errors="*{day}">day Error</th:block>
                    </p>
                  </div>
                  <div class="company-closure-month-day__field">
                    <label for="month" class="company-closure-month-day__label" th:text="#{company-closure.data.month}">
                      Monat
                    </label>
                    <input
                      required
                      type="text"
                      inputmode="numeric"
                      maxlength="2"
                      autocomplete="off"
                      placeholder="12"
                      th:field="*{month}"
                      th:errorclass="error"
                      th:classappend="${hasMonthDayErrors} ? 'error'"
                      th:aria-invalid="${hasMonthDayErrors or #fields.hasErrors('month')} ? 'true'"
                      th:aria-describedby="|monthDay-hint${hasMonthDayErrors ? ' monthDay-error' : ''}${#fields.hasErrors('month') ? ' month-error' : ''}|"
                      data-test-id="company-closure-month"
                    />
                    <p id="month-error" class="uv-form__input-error" th:if="${#fields.hasErrors('month')}">
                      <th:block th:errors="*{month}">month Error</th:block>
                    </p>
                  </div>
                </div>
                <p id="monthDay-error" class="uv-form__input-error" th:if="${hasMonthDayErrors}">
                  <th:block th:errors="*{monthDay}">monthDay Error</th:block>
                </p>
              </div>
            </div>

            <div th:unless="${monthDay == null}" class="uv-form__input-row">
              <span class="uv-form__label" th:text="|#{company-closure.data.date}:|">Datum</span>
              <span
                th:text="${#temporals.format(#temporals.create(2000, monthDay.monthValue, monthDay.dayOfMonth), #messages.msg('company-closure.data.monthDay.pattern'))}"
              ></span>
            </div>
          </div>

          <div class="uv-form__group">
            <p class="uv-form__group-info uv-help-block company-closure-form__info">
              <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
              <span
                id="names-description"
                th:text="#{company-closure.data.names.description(#{absences.overview.company-closure})}"
              >
                Gib den Namen in mindestens einer Sprache an.
              </span>
            </p>
            <div class="uv-form__input-row">
              <p
                id="names-label"
                class="uv-form__label uv-form__label--required"
                th:text="|#{company-closure.data.name}:|"
              >
                Name
              </p>
              <div role="group" aria-labelledby="names-label" class="flex flex-col gap-4 w-full">
                <p id="names-error" class="uv-form__input-error" th:if="${#fields.hasErrors('names')}">
                  <th:block th:errors="*{names}">names Error</th:block>
                </p>
                <div
                  th:each="name, nameStat : *{names}"
                  th:with="
                    nameField=|names[${nameStat.index}].name|,
                    nameId=|names${nameStat.index}.name|,
                    hasNameErrors=${#fields.hasErrors(nameField)}
                  "
                  class="flex flex-col gap-1"
                >
                  <input type="hidden" th:field="*{names[__${nameStat.index}__].locale}" />
                  <label th:for="${nameId}" class="flex items-center gap-2 font-normal">
                    <img th:src="@{/images/flags/{locale}.svg (locale=${name.locale})}" alt="" width="16" height="16" />
                    <span th:text="${#messages.msg('locale.' + name.locale)}">Deutsch</span>
                  </label>
                  <input
                    type="text"
                    maxlength="100"
                    th:placeholder="${namePlaceholders[name.locale]}"
                    th:lang="${name.locale.toLanguageTag()}"
                    th:field="*{names[__${nameStat.index}__].name}"
                    th:errorclass="error"
                    th:classappend="${#fields.hasErrors('names')} ? 'error'"
                    th:aria-invalid="${hasNameErrors or #fields.hasErrors('names')} ? 'true'"
                    th:aria-describedby="|names-description${#fields.hasErrors('names') ? ' names-error' : ''} ${nameId}-placeholder${hasNameErrors ? ' ' + nameId + '-error' : ''}|"
                    th:data-test-id="|company-closure-name-${name.locale}|"
                  />
                  <span
                    th:id="|${nameId}-placeholder|"
                    th:text="${namePlaceholders[name.locale]}"
                    class="sr-only"
                  ></span>
                  <p th:id="|${nameId}-error|" class="uv-form__input-error" th:if="${hasNameErrors}">
                    <th:block th:errors="*{__${nameField}__}">name Error</th:block>
                  </p>
                </div>
              </div>
            </div>

            <div class="uv-form__input-row pt-4" th:with="hasDayLengthErrors=${#fields.hasErrors('dayLength')}">
              <p
                id="dayLength-label"
                class="uv-form__label uv-form__label--required"
                th:text="|#{company-closure.data.dayLength}:|"
              >
                Betriebsruhe
              </p>
              <div role="radiogroup" aria-labelledby="dayLength-label" class="company-closure-day-length">
                <label th:each="dayLength : ${ {'MORNING', 'NOON', 'FULL', 'ZERO'} }">
                  <input
                    type="radio"
                    required
                    th:field="*{dayLength}"
                    th:value="${dayLength}"
                    th:aria-invalid="${hasDayLengthErrors} ? 'true'"
                    th:aria-describedby="${hasDayLengthErrors} ? 'dayLength-error'"
                  />
                  <th:block th:text="#{|company-closure.dayLength.${dayLength}|}">ganztägig</th:block>
                </label>
              </div>
              <p id="dayLength-error" class="uv-form__input-error" th:if="${hasDayLengthErrors}">
                <th:block th:errors="*{dayLength}">dayLength Error</th:block>
              </p>
            </div>
          </div>
        </div>

        <div role="group" aria-labelledby="group-companyclosure-validfrom-label">
          <h2
            id="group-companyclosure-validfrom-label"
            class="uv-form-legend"
            th:text="#{company-closure.data.validFrom}"
          >
            Gültig ab
          </h2>

          <div class="uv-form__group">
            <p class="uv-form__group-info uv-help-block">
              <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
              <span th:text="#{company-closure.data.validFrom.description}"></span>
            </p>
            <div class="uv-form__input-row">
              <label for="validFrom" th:text="|#{company-closure.data.validFrom}:|">Gültig ab</label>
              <input
                id="validFrom"
                required
                th:field="*{validFrom}"
                th:errorclass="error"
                th:placeholder="#{pattern.date}"
                autocomplete="off"
                th:data-iso-value="${companyClosure.validFromIsoValue}"
                th:data-min="${minValidFrom}"
                th:aria-invalid="${#fields.hasErrors('validFrom')} ? 'true'"
                th:aria-describedby="${#fields.hasErrors('validFrom')} ? 'validFrom-error'"
              />
              <p id="validFrom-error" class="uv-form__input-error" th:if="${#fields.hasErrors('validFrom')}">
                <th:block th:errors="*{validFrom}">validFrom Error</th:block>
              </p>
            </div>
          </div>
        </div>

        <uv-sticky data-sticky="bottom" class="bottom-bar mt-16" style="grid-column: label/end">
          <div class="bottom-bar-inner flex justify-between items-center">
            <button type="submit" class="button-main-green w-56" th:text="#{action.save}">Speichern</button>
            <button data-back-button th:text="#{action.cancel}" type="button" class="button">Abbrechen</button>
          </div>
        </uv-sticky>
      </form>
    </main>
  </body>
</html>
