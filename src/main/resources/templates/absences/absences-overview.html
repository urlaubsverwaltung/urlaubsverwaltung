<!doctype html>
<html
  lang="en"
  th:lang="${language}"
  th:class="|theme-${theme}|"
  th:data-nav-collapsed="${navigationCollapsed ? 'true' : null}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:asset="http://www.w3.org/1999/xhtml"
>
  <head
    th:replace="~{_layout::head(title=~{::title}, styles=~{::styles}, scriptsDefer=~{::scriptsDefer}, preload=~{::preload})}"
  >
    <title th:replace="~{fragments/page-title::page-title(#{absences.overview.header.title})}"></title>
    <th:block th:fragment="styles">
      <link rel="stylesheet" type="text/css" th:href="@{/css/absences-overview.css}" />
    </th:block>
    <th:block th:fragment="preload">
      <link rel="preload" th:replace="~{fragments/asset-dependency-preload::links('absences_overview.js')}" />
    </th:block>
    <th:block th:fragment="scriptsDefer">
      <script defer type="module" asset:src="absences_overview.js"></script>
    </th:block>
  </head>
  <body th:replace="~{_layout::body(content=~{::main})}">
    <main th:fragment="main">
      <div class="content-container content--max-w">
        <div th:replace="~{fragments/section-heading::section-heading(~{::absence-overview-heading-body}, ~{})}">
          <th:block th:ref="absence-overview-heading-body">
            <h1 th:text="#{absences.overview.title}">Absence Overview</h1>
          </th:block>
        </div>
        <div class="mt-4 @3xl/main:mt-6">
          <form action="#" th:action="@{/web/absences}" id="absenceOverviewForm" class="print:hidden px-4">
            <div
              class="items-baseline @3xl/main:grid gap-x-8 gap-y-4"
              style="grid-template-columns: min-content minmax(0, 22rem) 1fr"
            >
              <label
                class="mb-1 col-start-1 row-start-1 @3xl/main:mb-0"
                for="yearSelect"
                th:text="#{absences.overview.year}"
              >
                Year
              </label>
              <span class="col-start-2 col-end-2 row-start-1">
                <select
                  th:replace="~{fragments/select::one(id='yearSelect', name='year', options=~{::year-select-options})}"
                  id="yearSelect"
                >
                  <th:block th:fragment="year-select-options">
                    <option
                      th:each="i : ${#numbers.sequence(1,9)}"
                      th:with="year=${currentYear - 10 + i}"
                      th:selected="${#strings.equals(year, selectedYear)}"
                      th:text="${year}"
                    ></option>
                    <option
                      th:value="${currentYear}"
                      th:selected="${#strings.equals(currentYear, selectedYear)}"
                      th:text="${currentYear}"
                    ></option>
                    <option
                      th:value="${currentYear + 1}"
                      th:selected="${#strings.equals(currentYear + 1, selectedYear)}"
                      th:text="${currentYear + 1}"
                    ></option>
                  </th:block>
                </select>
              </span>

              <label
                class="mt-4 mb-1 col-start-1 row-start-2 @3xl/main:mt-0 @3xl/main:mb-0"
                for="monthSelect"
                th:text="#{absences.overview.month}"
              >
                Month
              </label>
              <span class="@3xl/main:mt-0 col-start-2 col-end-2 row-start-2">
                <select
                  th:replace="~{fragments/select::one(id='monthSelect', name='month', options=~{::month-select-options})}"
                  id="monthSelect"
                >
                  <th:block th:fragment="month-select-options">
                    <option
                      value=""
                      th:selected="${#strings.equals(selectedMonth, '')}"
                      th:text="#{month.all}"
                    ></option>
                    <option
                      th:each="i : ${#numbers.sequence(1, 12)}"
                      th:selected="${#strings.equals(selectedMonth, i)}"
                      th:value="${i}"
                    >
                      <th:block th:switch="${i}">
                        <th:block th:case="1" th:text="#{month.january}" />
                        <th:block th:case="2" th:text="#{month.february}" />
                        <th:block th:case="3" th:text="#{month.march}" />
                        <th:block th:case="4" th:text="#{month.april}" />
                        <th:block th:case="5" th:text="#{month.may}" />
                        <th:block th:case="6" th:text="#{month.june}" />
                        <th:block th:case="7" th:text="#{month.july}" />
                        <th:block th:case="8" th:text="#{month.august}" />
                        <th:block th:case="9" th:text="#{month.september}" />
                        <th:block th:case="10" th:text="#{month.october}" />
                        <th:block th:case="11" th:text="#{month.november}" />
                        <th:block th:case="12" th:text="#{month.december}" />
                      </th:block>
                    </option>
                  </th:block>
                </select>
              </span>

              <th:block th:if="${not #lists.isEmpty(visibleDepartments)}">
                <label
                  class="mt-4 mb-1 col-start-1 col-end-1 row-start-3 @3xl/main:mt-0 @3xl/main:mb-2"
                  for="departmentSelect"
                  th:text="#{absences.overview.department}"
                >
                  Department
                </label>
                <select
                  th:replace="~{fragments/select::multi(id='departmentSelect', name='department', options=~{::department-select-options}, className='row-start-3')}"
                  id="departmentSelect"
                >
                  <th:block th:fragment="department-select-options">
                    <option
                      th:each="department : ${visibleDepartments}"
                      value=""
                      th:value="${department.name}"
                      th:selected="${#lists.contains(selectedDepartments, department.name)}"
                      th:text="${department.name}"
                    ></option>
                  </th:block>
                </select>
                <p class="uv-help-block hidden @3xl/main:flex col-start-3 row-start-3">
                  <svg th:replace="~{icon/info::svg(className='uv-help-block-icon')}"></svg>
                  <th:block th:text="#{absences.overview.department.help}"></th:block>
                </p>
              </th:block>
            </div>
          </form>
        </div>
      </div>

      <div class="max-w-7xl px-8 mx-auto mt-8">
        <hr class="print:hidden" />
        <div th:each="month : ${absenceOverview.months}" class="mb-14">
          <h2
            th:id="${'absence-table-' + month.nameOfMonth}"
            class="text-2xl print:break-after-avoid"
            th:classappend="${#lists.size(absenceOverview.months) == 1 ? 'hidden print:block' : ''}"
          >
            <th:block th:text="${month.nameOfMonth}" />
            <span class="hidden print:inline" th:text="${selectedYear}" />
          </h2>
          <table
            id="absence-table"
            class="vacationOverview-table text-sm"
            role="grid"
            th:aria-describedby="${'absence-table-' + month.nameOfMonth}"
            is="uv-table-sortable"
          >
            <caption class="" th:text="#{absences.overview.table.caption(${month.nameOfMonth}, ${selectedYear})}">
              Absences in april 2022
            </caption>
            <thead>
              <tr>
                <th
                  scope="col"
                  class="print:hidden cursor-default p-2 sticky -left-0.5 bg-linear-to-r from-white dark:from-zinc-900 dark:via-zinc-900"
                >
                  &nbsp;
                </th>
                <th scope="col" class="cursor-default p-2" data-sortable data-sorted="true" data-sort-direction="asc">
                  &nbsp;
                </th>
                <th
                  th:each="day : ${month.days}"
                  scope="col"
                  class="non-sortable cursor-default vacationOverview-cal-head"
                  th:classappend="|${day.today ? 'today' : ''}${day.weekend ? ' weekend' : ''}|"
                >
                  <div class="p-2 leading-none text-center">
                    <span class="font-bold block" th:text="${day.dayOfMonth}"></span>
                    <span class="text-sm block text-zinc-500" th:text="${day.dayOfWeek}"></span>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody class="vacationOverview-tbody">
              <tr role="row" th:each="person : ${month.persons}">
                <th
                  scope="row"
                  class="p-0.5 print:hidden sticky -left-px bg-linear-to-r from-white dark:from-zinc-900 dark:via-zinc-900 border-l-0 z-10"
                >
                  <div class="print:hidden text-blue-50 dark:text-sky-800">
                    <img
                      th:replace="~{fragments/avatar::avatar-bordered(url=${person.gravatarUrl + '?d=404&s=32'},niceName=${person.firstName + ' ' + person.lastName},initials=${person.initials},width='32',height='32',personId=${person.id})}"
                      alt=""
                    />
                  </div>
                </th>
                <th scope="row" class="py-0.5 pl-2 pr-4 print:py-1.5">
                  <a th:href="@{/web/person/__${person.id}__/overview}" class="icon-link" data-turbo="false">
                    <div class="flex flex-col justify-center leading-tight">
                      <th:block th:text="${person.firstName}" />&nbsp;
                      <span th:text="${person.lastName}"></span>
                    </div>
                  </a>
                </th>
                <td
                  th:each="day, dayStat : ${person.days}"
                  th:classappend="${month.days[dayStat.index].today} ? 'today' : ''"
                  th:data-title="${day.publicHolidayName}"
                >
                  <div
                    class="cal-day"
                    th:classappend="|${day.type.publicHolidayFull ? 'public-holiday-full' : ''}${day.type.publicHolidayMorning ? ' public-holiday-morning' : ''}${day.type.publicHolidayNoon ? ' public-holiday-noon' : ''}${day.workday ? '' : ' no-workday'}|"
                  >
                    <div th:if="${not day.workday}" class="no-workday-marker" aria-hidden="true">
                      <svg th:replace="~{icon/slash::svg(className='no-workday-icon w-5 h-5 -translate-y-px')}"></svg>
                    </div>
                    <span
                      th:if="${day.publicHolidayName != null and #lists.isEmpty(day.bars.?[kind.name() == 'BRIDGE'])}"
                      class="sr-only"
                      th:text="${day.publicHolidayName}"
                    ></span>
                    <th:block
                      th:each="bar : ${day.bars}"
                      th:with="barClass=|absence-bar absence-bar--${#strings.toLowerCase(bar.half)} absence-bar--${#strings.toLowerCase(bar.kind)} absence-bar--status-${#strings.toLowerCase(bar.status)}${bar.roundedStart ? ' absence-bar--start' : ''}${bar.roundedEnd ? ' absence-bar--end' : ''}|, barStyle=|--absence-bar-color:var(--absence-color-${bar.color});--absence-bar-label-color:var(--absence-label-color-${bar.color})|"
                    >
                      <a
                        th:if="${bar.href != null}"
                        th:class="${barClass}"
                        th:style="${barStyle}"
                        th:data-title="${bar.title}"
                        th:href="@{${bar.href}}"
                        th:tabindex="${bar.tabStop} ? null : '-1'"
                      >
                        <span class="sr-only" th:text="${bar.title}"></span>
                        <span
                          th:if="${bar.label != null}"
                          class="absence-bar-label"
                          aria-hidden="true"
                          th:style="|--label-halves:${bar.labelHalves}|"
                          th:text="${bar.label}"
                        ></span>
                      </a>
                      <span
                        th:unless="${bar.href != null}"
                        th:class="${barClass}"
                        th:style="${barStyle}"
                        th:data-title="${bar.title}"
                      >
                        <span class="sr-only" th:text="${bar.title}"></span>
                        <span
                          th:if="${bar.label != null}"
                          class="absence-bar-label"
                          aria-hidden="true"
                          th:style="|--label-halves:${bar.labelHalves}|"
                          th:text="${bar.label}"
                        ></span>
                      </span>
                    </th:block>
                    <span class="hidden print:inline print:font-mono">
                      <th:block th:if="${day.type.absenceMorning}" th:text="#{absences.overview.absence.morning.abbr}">
                      </th:block>
                      <th:block
                        th:if="${day.type.absenceNoon}"
                        th:text="#{absences.overview.absence.noon.abbr}"
                      ></th:block>
                      <th:block th:if="${day.type.absenceFull}" th:text="#{absences.overview.absence.abbr}"></th:block>
                      <th:block
                        th:if="${day.type.waitingAbsenceMorning}"
                        th:text="#{absences.overview.absence.morning.waiting.abbr}"
                      >
                      </th:block>
                      <th:block
                        th:if="${day.type.waitingAbsenceNoon}"
                        th:text="#{absences.overview.absence.noon.waiting.abbr}"
                      ></th:block>
                      <th:block
                        th:if="${day.type.waitingAbsenceFull}"
                        th:text="#{absences.overview.absence.waiting.abbr}"
                      ></th:block>
                      <th:block
                        th:if="${day.type.activeSickNoteMorning}"
                        th:text="#{absences.overview.sick.morning.abbr}"
                      ></th:block>
                      <th:block
                        th:if="${day.type.activeSickNoteNoon}"
                        th:text="#{absences.overview.sick.noon.abbr}"
                      ></th:block>
                      <th:block
                        th:if="${day.type.activeSickNoteFull}"
                        th:text="#{absences.overview.sick.abbr}"
                      ></th:block>
                    </span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="vacationOverviewLegend" class="mb-8 print:break-inside-avoid">
          <table aria-hidden="true" class="vacationOverview-legend-table sticky left-4 text-sm print:font-mono">
            <caption th:text="#{absences.overview.legendTitle}"></caption>
            <tbody>
              <tr>
                <td class="vacationOverview-legend-colorbox vacationOverview-day-today-legend"></td>
                <td class="vacationOverview-legend-text" th:text="#{absences.overview.today}"></td>
              </tr>
              <tr>
                <td class="vacationOverview-legend-colorbox">
                  <div class="cal-day public-holiday-full"></div>
                </td>
                <td class="vacationOverview-legend-text" th:text="#{absences.overview.public-holiday}"></td>
              </tr>
              <tr>
                <td class="vacationOverview-legend-colorbox">
                  <div class="cal-day flex items-center justify-center">
                    <svg th:replace="~{icon/slash::svg(className='no-workday-icon')}" />
                  </div>
                </td>
                <td class="vacationOverview-legend-text" th:text="#{absences.overview.no-workday}"></td>
              </tr>
              <tr th:each="vacationTypeColor : ${vacationTypeColors}">
                <td class="vacationOverview-legend-colorbox">
                  <div class="cal-day">
                    <span
                      class="absence-bar absence-bar--full absence-bar--solid absence-bar--status-allowed absence-bar--start absence-bar--end"
                      th:styleappend="|--absence-bar-color:var(--absence-color-${vacationTypeColor.color});|"
                    ></span>
                  </div>
                  <span class="hidden print:inline" th:text="#{absences.overview.absence.abbr}"></span>
                </td>
                <td class="vacationOverview-legend-text" th:text="${vacationTypeColor.label}"></td>
              </tr>
              <tr th:if="${sickNoteLegendVisible}">
                <td class="vacationOverview-legend-colorbox">
                  <div class="cal-day">
                    <span
                      class="absence-bar absence-bar--full absence-bar--solid absence-bar--status-allowed absence-bar--start absence-bar--end"
                      style="--absence-bar-color: var(--absence-color-SICK_NOTE)"
                    ></span>
                  </div>
                  <span class="hidden print:inline" th:text="#{absences.overview.sick.abbr}"></span>
                </td>
                <td class="vacationOverview-legend-text" th:text="#{absences.overview.sick}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
