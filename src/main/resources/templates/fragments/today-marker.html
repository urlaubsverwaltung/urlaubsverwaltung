<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>today-marker</title>
  </head>
  <body>
    <tr th:fragment="row(marker, colspan)" class="today-marker">
      <td th:colspan="${colspan}">
        <div th:replace="~{fragments/today-marker::content(marker=${marker}, className='')}"></div>
      </td>
    </tr>

    <li th:fragment="item(marker)" role="presentation" class="today-marker">
      <div th:replace="~{fragments/today-marker::content(marker=${marker}, className='col-span-full')}"></div>
    </li>

    <div th:fragment="content(marker, className)" class="flex items-center gap-3" th:classappend="${className}">
      <span
        class="rounded-full bg-(--uv-cal-today-border-color)/20 px-2.5 py-0.5 text-xs font-semibold text-zinc-700 whitespace-nowrap dark:text-zinc-200"
      >
        <th:block th:text="#{overview.today.label}">Heute</th:block>
        &middot;
        <th:block
          th:replace="~{fragments/date::date(date=${marker.today}, pattern=#{pattern.date.day-of-week.short})}"
        ></th:block>
      </span>
      <span class="h-0.5 grow bg-(--uv-cal-today-border-color)/40" aria-hidden="true"></span>
    </div>
  </body>
</html>
