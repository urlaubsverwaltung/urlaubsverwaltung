<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>today-marker</title>
  </head>
  <body>
    <tr th:fragment="row(marker, colspan)" class="today-marker">
      <td th:colspan="${colspan}">
        <div class="flex items-center gap-3">
          <span
            class="rounded-full bg-(--uv-cal-today-border-color) px-2.5 py-0.5 text-xs font-semibold text-white whitespace-nowrap"
          >
            <th:block th:text="#{overview.today.label}">Heute</th:block>
            &middot;
            <th:block
              th:replace="~{fragments/date::date(date=${marker.today}, pattern=#{pattern.date.day-of-week.short})}"
            ></th:block>
          </span>
          <span class="h-0.5 grow bg-(--uv-cal-today-border-color)" aria-hidden="true"></span>
        </div>
      </td>
    </tr>
  </body>
</html>
