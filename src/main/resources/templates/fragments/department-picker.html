<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>department-picker</title>
  </head>
  <body>
    <uv-department-picker
      th:fragment="department-picker(id, picker)"
      th:with="selectedNames=${picker.selectedNames()}, selectedCount=${#lists.size(selectedNames)}"
      class="department-picker"
    >
      <button
        type="button"
        th:id="${id}"
        th:popovertarget="|${id}-popover|"
        th:aria-describedby="|${id}-summary|"
        class="popover-button-select department-picker__button"
      >
        <!--/* a host label names the button and hides its content from the accessible name - the summary is its description */-->
        <span th:id="|${id}-summary|" class="department-picker__summary">
          <th:block th:if="${picker.allPersonsSelected}" th:text="#{department-picker.all-persons}"></th:block>
          <th:block
            th:unless="${picker.allPersonsSelected}"
            th:text="${#strings.listJoin(selectedNames, ', ')}"
          ></th:block>
        </span>
        <span
          th:if="${!picker.allPersonsSelected and selectedCount >= 3}"
          class="department-picker__badge"
          th:text="${selectedCount}"
        ></span>
      </button>
      <div
        th:id="|${id}-popover|"
        popover
        class="popover-menu popover--backdrop-screen department-picker__popover xs:popover--backdrop-none"
      >
        <div th:if="${#lists.size(picker.options) > 8}" class="department-picker__search">
          <label th:for="|${id}-search|" class="sr-only" th:text="#{department-picker.search}">Abteilung suchen</label>
          <input
            th:id="|${id}-search|"
            type="search"
            th:placeholder="#{department-picker.search}"
            autocomplete="off"
            data-department-picker-search
          />
        </div>
        <label class="department-picker__option department-picker__option--all">
          <input
            type="checkbox"
            class="uv-checkbox"
            name="allPersons"
            value="true"
            autocomplete="off"
            th:checked="${picker.allPersonsSelected}"
            th:aria-describedby="|${id}-all-persons-hint|"
            data-department-picker-all
          />
          <span class="leading-tight">
            <th:block th:text="#{department-picker.all-persons}">Alle Personen</th:block>
            <!--/* the hint is the description of the checkbox - as part of the label it would lengthen its name */-->
            <small
              th:id="|${id}-all-persons-hint|"
              aria-hidden="true"
              th:text="#{department-picker.all-persons.hint}"
            ></small>
          </span>
          <!--/* the bare number would be read as part of the name of the checkbox without telling what it counts */-->
          <span class="department-picker__count" aria-hidden="true" th:text="${picker.allPersonsCount}"></span>
          <span class="sr-only" th:text="#{department-picker.persons(${picker.allPersonsCount})}"></span>
        </label>
        <ul class="department-picker__list" role="group" th:aria-label="#{department-picker.departments}">
          <li th:each="option, optionStat : ${picker.options}">
            <label class="department-picker__option">
              <input
                type="checkbox"
                class="uv-checkbox"
                name="department"
                autocomplete="off"
                th:value="${option.name}"
                th:checked="${option.selected}"
                th:aria-describedby="${#strings.isEmpty(option.description)} ? null : |${id}-department-${optionStat.index}-description|"
                data-department-picker-department
              />
              <span class="department-picker__label leading-tight">
                <th:block th:text="${option.name}"></th:block>
                <!--/* the description is the description of the checkbox - as part of the label it would lengthen its name */-->
                <small
                  th:unless="${#strings.isEmpty(option.description)}"
                  th:id="|${id}-department-${optionStat.index}-description|"
                  class="department-picker__description"
                  aria-hidden="true"
                  th:text="${option.description}"
                ></small>
              </span>
              <span class="department-picker__count" aria-hidden="true" th:text="${option.activeMemberCount}"></span>
              <span class="sr-only" th:text="#{department-picker.persons(${option.activeMemberCount})}"></span>
            </label>
          </li>
          <li
            class="department-picker__no-hit"
            hidden
            data-department-picker-no-hit
            th:text="#{department-picker.search.no-hit}"
          ></li>
        </ul>
        <div class="department-picker__footer">
          <button
            type="submit"
            class="button-main py-1.5 px-3 w-full"
            th:text="#{action.confirm}"
            data-department-picker-confirm
          ></button>
        </div>
      </div>
    </uv-department-picker>
  </body>
</html>
